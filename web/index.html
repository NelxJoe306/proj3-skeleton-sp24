<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>proj3C — BYOW in the browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="world"></canvas>

    <section id="menu" role="dialog" aria-label="主菜单">
      <h1>proj3C <span class="sub">BYOW in the browser</span></h1>
      <div class="resume-actions">
        <button id="continue-btn" type="button" class="secondary">继续 Continue</button>
        <button id="load-btn" type="button" class="secondary">读档 Load</button>
      </div>
      <p class="resume-note">刷新/关闭后回来点「继续」可续上一局；「读档」读取最近一次「保存并退出」留下的存档。</p>
      <div class="divider"></div>
      <form id="new-game-form">
        <fieldset>
          <legend>地图尺寸 Size</legend>
          <div class="size-options">
            <label><input type="radio" name="size" value="small">小 40×40</label>
            <label><input type="radio" name="size" value="medium" checked>中 80×80</label>
            <label><input type="radio" name="size" value="large">大 120×120</label>
          </div>
        </fieldset>
        <div class="field-row">
          <label for="seed">种子 Seed（留空则随机）</label>
          <input id="seed" name="seed" type="text" inputmode="numeric" autocomplete="off"
                 placeholder="留空 = 随机">
        </div>
        <button type="submit">开始 New Game</button>
        <p id="menu-error" class="error" hidden></p>
      </form>
      <p class="hint">WASD 移动 · 到达 ★ 过关（方向键将于后续加入）</p>
    </section>

    <div id="hud" hidden>
      <span id="hud-world" class="stat"></span>
      <span id="hud-steps" class="stat"></span>
      <span id="hud-dist" class="stat"></span>
    </div>

    <div id="game-btns" hidden>
      <button id="save-btn" type="button" title="把当前进度写入存档并回主菜单">保存并退出</button>
      <button id="quit-btn" type="button" class="danger" title="不存档，回主菜单（放弃本局）">退出</button>
    </div>

    <div id="banner" hidden>
      <p id="banner-text"></p>
      <button id="banner-again" type="button">返回主菜单 Menu</button>
    </div>
  </div>

  <script src="view.js"></script>
  <script src="render.js"></script>
  <script src="keypipe.js"></script>
  <script src="app.js"></script>
</body>
</html>
